appId: com.wriai.backlinklaunchpad
productName: Backlink Launchpad
copyright: Copyright © 2026 Wriai
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!out/test/**"
  - "!**/*.map"
asarUnpack:
  - "**/*.node"
# Tray icon (the window icon comes from the exe, but the tray needs an image file).
extraResources:
  - from: build/icon.png
    to: icon.png
  # Browser extension loaded into the normal browser window (copied to the data folder at startup).
  - from: extension
    to: extension
npmRebuild: true
# Update feed for electron-updater: the installed app checks the latest (non-draft) GitHub release for
# latest.yml / latest-mac.yml / latest-linux.yml. Builds never upload (--publish never); the release workflow
# attaches the installers and these files to a draft release, which goes live when you publish it.
publish:
  provider: github
  owner: BoxiBoxi
  repo: backlink-launchpad
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: Backlink-Launchpad-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Backlink Launchpad

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what produces latest-mac.yml, so the Mac app can see that a new version exists.
    - target: zip
      arch: [arm64, x64]
  artifactName: Backlink-Launchpad-${version}-${arch}.${ext}

linux:
  category: Office
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Backlink-Launchpad-${version}-${arch}.${ext}
